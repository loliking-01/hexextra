# hexextra 的 NeoForge 元数据。
# 下面的占位符由 build.gradle 的 generateModMetadata 任务,按 gradle.properties 的值替换。

modLoader = "javafml"
loaderVersion = "${loader_version_range}"

license = "${mod_license}"
issueTrackerURL = "https://github.com/loliking-01/hexextra/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://modrinth.com/mod/hexextra"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

# ---------------------------------------------------------------------------
# 依赖
# ---------------------------------------------------------------------------

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# 咒法学(Hex Casting)—— 本附属模组的核心前置。
# 必须声明,否则缺少咒法学时游戏只会给一句模糊的崩溃,而不是清晰提示。
# ordering = "AFTER" 保证咒法学先完成注册,我们再往里挂图案与续延帧。
[[dependencies."${mod_id}"]]
modId = "hexcasting"
type = "required"
versionRange = "${hexcasting_version_range}"
ordering = "AFTER"
side = "BOTH"