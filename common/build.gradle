plugins {
    // 只依赖原版 Minecraft,不含任何加载器 —— 保证这里的代码天然双端
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT'
    id 'org.jetbrains.kotlin.jvm'
}

minecraft {
    version(minecraftVersion)
}

dependencies {
    compileOnly "org.jetbrains:annotations:$jetbrainsAnnotationsVersion"
    compileOnly "maven.modrinth:$hexcastingModrinthId:$hexcastingForgeVersionId"
    // 咒法学是 Kotlin 写的,ContinuationFrame.breakDownwards 返回 kotlin.Pair
    // common 只编原版,所以要自己声明 kotlin 标准库(compileOnly 即可)
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:$kotlinStdlibVersion"
}

kotlin {
    jvmToolchain(17)
}

// ---------------------------------------------------------------------------
// Mixin:让「群体之拆解」「群体之策略」认识条件链与 switch 表
//
// 目标是咒法学自己的类,方法名是 mod 自定义的、不走 intermediary / SRG 重映射,
// 因此注入点标注 remap = false,两端共用这一份源码。
// 这里只需要编译期的 Mixin 库;实际的加载配置在 common 的 hexextra.mixins.json,
// 由 Fabric 的 fabric.mod.json 与 Forge 的 mixingradle 分别引入。
// ---------------------------------------------------------------------------
repositories {
    maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
}

dependencies {
    compileOnly "org.spongepowered:mixin:0.8.5"
}
