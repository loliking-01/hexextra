
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
        // Kotlin 仅用于工具扩展(见 AGENTS.md 规则 3);Forge 模块是 legacy buildscript 脚本,插件挂这里
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0"
    // Mixin 注解处理器 + Gradle 插件
    classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'org.spongepowered.mixin'

base { archivesName = "$modID-${minecraftVersion}forge" }

minecraft {
    mappings channel: 'official', version: minecraftVersion

    // 开发用运行配置。runs 必须嵌在 minecraft { } 里面(ForgeGradle 6 的要求)
    runs {
        client {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                hexextra { source sourceSets.main }
            }
        }

        server {
            workingDirectory project.file('run')
            // 本工程的 common 源码已经通过 compileJava { source(...) } 编进 main,
            // 所以这里只需要声明 main 这一个 source
            mods {
                hexextra {
                    source sourceSets.main
                }
            }
            // 关键:让 Mixin 把依赖 jar 里的 SRG refmap 重映射到开发环境的 mojmap 名,
            // 否则 inline 之类前置的 mixin 会报 "could not find any targets matching ... m_131146_"
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--nogui', '--port', '25588'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}"
    // Forge 侧必须 deobf 才能用 mod 的类
    implementation fg.deobf("maven.modrinth:$hexcastingModrinthId:$hexcastingForgeVersionId")
    // 咒法学把 TropheusJ 的 serialization-hooks 用 include 打进了自己的 jar,没有公开 Maven。
    // 这里从 HC 的 jar 里解出来当本地依赖用(见 libs/README 说明)。
    implementation files(rootProject.file('libs/serialization-hooks-0.4.99999.jar'))
    // 咒法学的 ContinuationFrame.breakDownwards 返回 kotlin.Pair,编译需要 kotlin 标准库
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:$kotlinStdlibVersion"

    // ---- 咒法学 0.11.4 在 Forge 侧的硬依赖(坐标与版本照抄上游 v0.11.4)----
    // 注意都用 implementation 而不是 compileOnly:compileOnly 不进运行期类路径,
    // 服务端启动时会报 "Missing or unsupported mandatory dependencies"
    implementation "thedarkcolour:kotlinforforge:$kotlinForForgeVersion"
    implementation fg.deobf("top.theillusivec4.caelus:caelus-forge:$caelusVersion")
    // inline 硬依赖 cloth-config(客户端尤其需要,否则 Missing or unsupported mandatory dependencies)
    implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:$clothConfigVersion")
    implementation fg.deobf("com.samsthenerd.inline:inline-forge:$minecraftVersion-$inlineVersion")
    implementation fg.deobf("at.petra-k.paucal:paucal-forge-$minecraftVersion:$paucalVersion")
    implementation fg.deobf("vazkii.patchouli:Patchouli:$minecraftVersion-$patchouliVersion-FORGE-SNAPSHOT")
}

// 同 Fabric:把 common 的源码与资源编进来
compileJava { source(project(':common').sourceSets.main.allSource) }
processResources { from project(':common').sourceSets.main.resources }

// Forge 侧必须 reobf,否则运行时类名对不上
jar.finalizedBy('reobfJar')

// common 里的 Kotlin 源码:compileJava 的 source(...) 只管 .java,这里单独接上
compileKotlin { source(project(':common').sourceSets.main.allSource) }

kotlin {
    jvmToolchain(17)
}

// ---------------------------------------------------------------------------
// Mixin:让「群体之拆解」「群体之策略」认识条件链与 switch 表
//
// 目标是咒法学自己的类(OpSplat / OpLastNToList),它们的方法名是 mod 自己定义的,
// 不走 SRG 重映射 —— 所以 @Inject 上标了 remap = false,注解处理器也就不会去查
// 那个查不到的混淆映射(这正是之前构建失败的原因)。
// ---------------------------------------------------------------------------
dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, "hexextra.forge.mixins.refmap.json"
    config "hexextra.forge.mixins.json"
}
