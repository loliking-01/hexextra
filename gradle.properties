# Gradle 本体
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

## 模组信息
modID=hexextra
modName=hexextra
modVersion=0.0.1-alpha
mavenGroup=com.llk

## 目标平台(Minecraft 1.20.1)
#
# 这里的每一个版本号都取自上游 Hex Casting v0.11.4 自己的构建配置,
# 是一套确认可用的组合,不要随手改。
minecraftVersion=1.20.1
forgeVersion=47.1.47
fabricLoaderVersion=0.19.2
fabricVersion=0.92.8+1.20.1
fabricLanguageKotlinVersion=1.13.7+kotlin.2.2.21
jetbrainsAnnotationsVersion=23.0.0

## 咒法学及其前置(1.20.1 线,0.11.x)
hexcastingVersion=0.11.4
paucalVersion=0.6.0-pre-118
patchouliVersion=83
inlineVersion=1.2.2
clothConfigVersion=11.1.106

## 咒法学 0.11.4 的 Maven 坐标(Modrinth Maven)
#
# Modrinth 的 artifactId 是「项目 ID」而不是 slug;0.11.4 有 forge / fabric 两个重名版本,
# 所以用「版本 ID」精确指定,避免解析到另一个 loader 的包。
#   项目 ID: nTW3yKrm (Hex Casting)
#   forge 0.11.4  → e41256fb  → hexcasting-forge-1.20.1-0.11.4.jar
#   fabric 0.11.4 → d1pTywTc  → hexcasting-fabric-1.20.1-0.11.4.jar
hexcastingModrinthId=nTW3yKrm
hexcastingForgeVersionId=e41256fb
hexcastingFabricVersionId=d1pTywTc
cardinalComponentsVersion=5.2.1
